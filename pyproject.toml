[project]
name = "ha-home-finance"
version = "0.0.0"
description = "Home Assistant custom integration for the home-finance Integration API"
requires-python = ">=3.14"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "D", "PL", "ASYNC", "PT", "TID", "C4"]
ignore = [
  "D203", "D213", "D105", "D107",
  "PLR0913", "PLR2004", "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR0915", "PLR0912"]
"scripts/**" = ["D", "T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=custom_components.home_finance --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true
